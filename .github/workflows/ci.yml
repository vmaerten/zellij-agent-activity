name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# setup-rust-toolchain bundles the cargo cache and installs the Rust problem
# matcher, so compiler/clippy/rustfmt errors are annotated inline on the PR.
# `rustflags: ""` keeps the action from setting a global RUSTFLAGS=-D warnings,
# which would also apply to dependencies — the clippy job already gates our own
# code on warnings.

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
          cache: false
          rustflags: ""
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
          rustflags: ""
      - run: cargo clippy --all-targets -- -D warnings

  # The forwarder normalizes each harness's vocabulary (ADR-0007), so it holds the
  # only logic outside `cargo test`. No toolchain needed — just bash and jq.
  producer:
    name: producer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/test-hook.sh

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - run: cargo test

  wasm:
    name: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-wasip1
          rustflags: ""
      - run: cargo build --release --target wasm32-wasip1
