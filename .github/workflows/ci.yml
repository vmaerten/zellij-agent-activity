name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# rustflags: "" — the action defaults to a global -D warnings that would apply
# to dependencies too; the clippy job already gates our own code.

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
          cache: false
          rustflags: ""
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
          rustflags: ""
      - run: cargo clippy --all-targets -- -D warnings

  producer:
    name: producer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash producers/claude/scripts/test-forwarder.sh
      # A broken manifest is only discovered at install time otherwise.
      - run: jq empty .claude-plugin/marketplace.json producers/claude/.claude-plugin/plugin.json producers/claude/hooks/hooks.json
      # `version` pins the plugin: pushing the producer without bumping it is a
      # no-op for everyone who already installed. Fail loudly instead.
      - name: producer version matches the crate
        run: |
          crate=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          plugin=$(jq -r .version producers/claude/.claude-plugin/plugin.json)
          test "$crate" = "$plugin" || {
            echo "version drift: Cargo.toml=$crate plugin.json=$plugin — run task bump"
            exit 1
          }

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - run: cargo test

  wasm:
    name: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-wasip1
          rustflags: ""
      - run: cargo build --release --target wasm32-wasip1
