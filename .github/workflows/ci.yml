name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# rustflags: "" — the action defaults to a global -D warnings that would apply
# to dependencies too; the clippy job already gates our own code.

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
          cache: false
          rustflags: ""
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
          rustflags: ""
      - run: cargo clippy --all-targets -- -D warnings

  producer:
    name: producer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: bash producers/claude/scripts/test-forwarder.sh
      - run: bash producers/codex/scripts/test-forwarder.sh
      - run: node --test producers/opencode/zellij-agent-activity.test.js
      # A broken manifest is only discovered at install time otherwise.
      - run: jq empty .claude-plugin/marketplace.json producers/claude/.claude-plugin/plugin.json producers/claude/hooks/hooks.json
      - run: jq empty .agents/plugins/marketplace.json producers/codex/.codex-plugin/plugin.json producers/codex/hooks/hooks.json
      # Claude Code loads hooks/hooks.json by itself; naming it in the manifest
      # too is a duplicate that fails the whole plugin at install. `claude plugin
      # validate` does not catch it, so this does. Codex replaces the default
      # instead of adding to it, so this is a Claude-only trap.
      - name: manifest does not redeclare the standard hooks file
        run: |
          jq -e '(.hooks // "") | test("hooks/hooks\\.json$") | not' \
            producers/claude/.claude-plugin/plugin.json >/dev/null || {
            echo "plugin.json declares the auto-loaded hooks/hooks.json — remove the \"hooks\" key"
            exit 1
          }
      # Codex resolves .agents/plugins/marketplace.json before .claude-plugin's, so
      # a Codex entry pointing at the Claude producer would install the wrong hooks.
      - name: the Codex marketplace lists the Codex producer only
        run: |
          jq -e '[.plugins[].source] == ["./producers/codex"]' \
            .agents/plugins/marketplace.json >/dev/null || {
            echo ".agents/plugins/marketplace.json must list exactly the Codex producer"
            exit 1
          }
      # `version` pins the plugin: pushing a producer without bumping it is a
      # no-op for everyone who already installed. Fail loudly instead.
      - name: producer versions match the crate
        run: |
          crate=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          for manifest in producers/claude/.claude-plugin/plugin.json \
                          producers/codex/.codex-plugin/plugin.json; do
            plugin=$(jq -r .version "$manifest")
            test "$crate" = "$plugin" || {
              echo "version drift: Cargo.toml=$crate $manifest=$plugin — run task bump"
              exit 1
            }
          done
          # The opencode producer has no manifest to pin: it carries its version
          # in the plugin file, which its debug log stamps every line with.
          plugin=$(perl -ne 'print "$1" if /^const VERSION = "(.*)"/' producers/opencode/zellij-agent-activity.js)
          test "$crate" = "$plugin" || {
            echo "version drift: Cargo.toml=$crate opencode plugin=$plugin — run task bump"
            exit 1
          }

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - run: cargo test

  wasm:
    name: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-wasip1
          rustflags: ""
      - run: cargo build --release --target wasm32-wasip1
