name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  WASM: target/wasm32-wasip1/release/zellij-agent-activity.wasm

jobs:
  release:
    name: Build wasm · publish Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (bundles the cargo cache)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-wasip1
          rustflags: ""

      - name: Verify tag matches Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(cargo metadata --no-deps --format-version 1 \
            | grep -o '"version":"[^"]*"' | head -n1 | cut -d'"' -f4)"
          echo "tag=$tag  Cargo.toml=$manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::Tag v$tag does not match Cargo.toml version $manifest"
            exit 1
          fi

      - name: Build wasm
        run: cargo build --release --target wasm32-wasip1

      # CHANGELOG.md is the source of truth: it is generated and committed by
      # `task release` before the tag, so the Release body is extracted from it
      # rather than regenerated — no git-cliff in CI, and the two can't diverge.
      # The prose lives in .github/release-notes.md.tmpl; this step only fills
      # in the placeholders, so editing the notes never means editing shell.
      - name: Assemble release notes
        env:
          TAG: ${{ github.ref_name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          ver="${TAG#v}"

          # The Zellij compat floor is derived from the lockfile, never hardcoded.
          zt="$(grep -A2 'name = "zellij-tile"' Cargo.lock \
            | grep version | head -n1 | cut -d'"' -f2)"

          awk -v ver="$ver" '
            $0 ~ "^## \\[" ver "\\]" {found=1; next}
            found && (/^## \[/ || /^\[[^]]+\]: /) {exit}
            found {print}
          ' CHANGELOG.md > changes.md

          if [ -z "$(tr -d '[:space:]' < changes.md)" ]; then
            echo "::error::CHANGELOG.md has no section for $ver — run 'task changelog NEW=$ver'"
            exit 1
          fi

          # `r` queues the file, `d` drops the placeholder line: the classic
          # sed include. `|` as delimiter keeps the URLs slash-safe.
          sed -e "s|{{ZELLIJ_TILE}}|$zt|g" \
              -e "s|{{REPO_URL}}|$REPO_URL|g" \
              -e "s|{{TAG}}|$TAG|g" \
              -e "/{{CHANGES}}/r changes.md" \
              -e "/{{CHANGES}}/d" \
              .github/release-notes.md.tmpl > RELEASE_NOTES.md

          if grep -q '{{' RELEASE_NOTES.md; then
            echo "::error::unsubstituted placeholder left in the release notes"
            grep -n '{{' RELEASE_NOTES.md
            exit 1
          fi

          echo "--- release notes ---"
          cat RELEASE_NOTES.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.WASM }}
          body_path: RELEASE_NOTES.md
          # The curated changelog replaces GitHub's auto notes, which would list
          # the same changes a second time.
          generate_release_notes: false
