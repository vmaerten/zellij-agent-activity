name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  WASM: target/wasm32-wasip1/release/zellij-agent-activity.wasm

jobs:
  release:
    name: Build wasm · publish Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (bundles the cargo cache)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-wasip1
          rustflags: ""

      - name: Verify tag matches Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(cargo metadata --no-deps --format-version 1 \
            | grep -o '"version":"[^"]*"' | head -n1 | cut -d'"' -f4)"
          echo "tag=$tag  Cargo.toml=$manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::Tag v$tag does not match Cargo.toml version $manifest"
            exit 1
          fi

      - name: Build wasm
        run: cargo build --release --target wasm32-wasip1

      # CHANGELOG.md is the source of truth: it is generated and committed by
      # `task release` before the tag, so the Release body is extracted from it
      # rather than regenerated — no git-cliff in CI, and the two can't diverge.
      - name: Assemble release notes
        env:
          TAG: ${{ github.ref_name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          ver="${TAG#v}"

          # The Zellij compat floor is derived from the lockfile, never hardcoded.
          zt="$(grep -A2 'name = "zellij-tile"' Cargo.lock \
            | grep version | head -n1 | cut -d'"' -f2)"

          section="$(awk -v ver="$ver" '
            $0 ~ "^## \\[" ver "\\]" {found=1; next}
            found && (/^## \[/ || /^\[[^]]+\]: /) {exit}
            found {print}
          ' CHANGELOG.md)"

          if [ -z "$(printf '%s' "$section" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has no section for $ver — run 'task changelog NEW=$ver'"
            exit 1
          fi

          {
            printf '## Compatibility\n\n'
            printf 'Built against `zellij-tile %s` — requires **Zellij >= %s**.\n' "$zt" "$zt"
            printf 'Full matrix and migration notes: [docs/COMPATIBILITY.md](%s/blob/%s/docs/COMPATIBILITY.md)\n\n' "$REPO_URL" "$TAG"
            printf '## Changes\n%s\n\n' "$section"
            printf '## Install\n\n'
            printf '```sh\n'
            printf 'curl -L -o ~/.config/zellij/plugins/zellij-agent-activity.wasm \\\n'
            printf '  %s/releases/download/%s/zellij-agent-activity.wasm\n' "$REPO_URL" "$TAG"
            printf '```\n\n'
            printf 'Load it alongside `zellij-tab-namer` in `~/.config/zellij/config.kdl` (see the README).\n'
          } > RELEASE_NOTES.md

          echo "--- release notes ---"
          cat RELEASE_NOTES.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.WASM }}
          body_path: RELEASE_NOTES.md
          # The curated changelog replaces GitHub's auto notes, which would list
          # the same changes a second time.
          generate_release_notes: false
