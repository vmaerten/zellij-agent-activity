name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  WASM: target/wasm32-wasip1/release/zellij-agent-activity.wasm

jobs:
  release:
    name: Build wasm · publish Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (bundles the cargo cache)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-wasip1
          rustflags: ""

      - name: Verify tag matches Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(cargo metadata --no-deps --format-version 1 \
            | grep -o '"version":"[^"]*"' | head -n1 | cut -d'"' -f4)"
          echo "tag=$tag  Cargo.toml=$manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::Tag v$tag does not match Cargo.toml version $manifest"
            exit 1
          fi

      - name: Build wasm
        run: cargo build --release --target wasm32-wasip1

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.WASM }}
          generate_release_notes: true
          body: |
            ## Compatibility

            Built against `zellij-tile 0.44.x` — requires **Zellij ≥ 0.44.3**.
            Tested on Zellij 0.44.x; a newer Zellij minor may require a rebuild.

            ## Install

            ```sh
            curl -L -o ~/.config/zellij/plugins/zellij-agent-activity.wasm \
              https://github.com/vmaerten/zellij-agent-activity/releases/download/${{ github.ref_name }}/zellij-agent-activity.wasm
            ```

            Load it alongside `zellij-tab-namer` in `~/.config/zellij/config.kdl` (see the README).
