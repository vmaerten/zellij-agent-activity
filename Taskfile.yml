version: '3'

vars:
  CURRENT:
    sh: grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2
  WASM: target/wasm32-wasip1/release/zellij-agent-activity.wasm

tasks:
  default:
    cmds:
      - task --list
    silent: true

  version:
    desc: Print the current Cargo.toml version.
    cmds:
      - echo {{.CURRENT}}
    silent: true

  wasm:
    desc: Build the release wasm plugin.
    cmds:
      - cargo build --release --target wasm32-wasip1
      - 'echo "-> {{.WASM}}"'

  ci:
    desc: Run the exact checks CI runs (fmt, clippy, producer tests, test, wasm build).
    cmds:
      - cargo fmt --all --check
      - cargo clippy --all-targets -- -D warnings
      # The producers' normalization is the only logic outside cargo test.
      - bash producers/claude/scripts/test-forwarder.sh
      - bash producers/codex/scripts/test-forwarder.sh
      - node --test producers/opencode/zellij-agent-activity.test.js
      # A broken manifest is only discovered at install time otherwise. CI has no
      # claude CLI, so it falls back to a syntax-only check.
      - if command -v claude >/dev/null; then claude plugin validate .; fi
      - jq empty .claude-plugin/marketplace.json producers/claude/.claude-plugin/plugin.json producers/claude/hooks/hooks.json
      - jq empty .agents/plugins/marketplace.json producers/codex/.codex-plugin/plugin.json producers/codex/hooks/hooks.json
      # Claude Code loads hooks/hooks.json by itself; naming it in the manifest too
      # is a duplicate that fails the whole plugin at install, and `claude plugin
      # validate` does not catch it. Codex replaces the default instead of adding
      # to it, so this is a Claude-only trap.
      - 'jq -e ''(.hooks // "") | test("hooks/hooks\\.json$") | not'' producers/claude/.claude-plugin/plugin.json >/dev/null || { echo "plugin.json declares the auto-loaded hooks/hooks.json — remove the \"hooks\" key"; exit 1; }'
      # Codex resolves .agents/plugins/marketplace.json before .claude-plugin's, so
      # a Codex entry pointing at the Claude producer would install the wrong hooks.
      - 'jq -e ''[.plugins[].source] == ["./producers/codex"]'' .agents/plugins/marketplace.json >/dev/null || { echo ".agents/plugins/marketplace.json must list exactly the Codex producer"; exit 1; }'
      # `version` pins the plugin: pushing a producer without bumping it is a
      # no-op for everyone who already installed. Fail loudly instead.
      - 'p=$(jq -r .version producers/claude/.claude-plugin/plugin.json); test "$p" = "{{.CURRENT}}" || { echo "version drift: Cargo.toml={{.CURRENT}} claude plugin.json=$p — run task bump"; exit 1; }'
      - 'p=$(jq -r .version producers/codex/.codex-plugin/plugin.json); test "$p" = "{{.CURRENT}}" || { echo "version drift: Cargo.toml={{.CURRENT}} codex plugin.json=$p — run task bump"; exit 1; }'
      # The opencode producer has no manifest to pin: it carries its version in
      # the plugin file, which is what its debug log stamps every line with.
      - 'p=$(perl -ne ''print "$1" if /^const VERSION = "(.*)"/'' producers/opencode/zellij-agent-activity.js); test "$p" = "{{.CURRENT}}" || { echo "version drift: Cargo.toml={{.CURRENT}} opencode plugin=$p — run task bump"; exit 1; }'
      - cargo test
      - cargo build --release --target wasm32-wasip1

  bump:
    desc: 'Set the version in Cargo.toml and every producer. Prompts for NEW if omitted. Usage: task bump [NEW=0.2.0]'
    requires:
      vars:
        - name: NEW
    preconditions:
      - sh: 'echo "{{.NEW}}" | grep -Eq "^[0-9]+\.[0-9]+\.[0-9]+$"'
        msg: 'NEW must be semver X.Y.Z (got "{{.NEW}}")'
    cmds:
      - perl -i -pe 's/^version = ".*"/version = "{{.NEW}}"/' Cargo.toml
      # Kept in lockstep with the crate: one number describes the whole system.
      # Claude Code pins the plugin on this string, so it must move every release.
      - perl -i -pe 's/^(\s*"version":\s*").*(",)$/${1}{{.NEW}}${2}/' producers/claude/.claude-plugin/plugin.json
      - perl -i -pe 's/^(\s*"version":\s*").*(",)$/${1}{{.NEW}}${2}/' producers/codex/.codex-plugin/plugin.json
      - perl -i -pe 's/^const VERSION = ".*"/const VERSION = "{{.NEW}}"/' producers/opencode/zellij-agent-activity.js
      - cargo update --workspace --quiet
      - 'echo "bumped -> {{.NEW}}"'

  changelog:
    desc: 'Prepend a version section to CHANGELOG.md. Prompts for NEW if omitted. Usage: task changelog [NEW=0.2.0]'
    requires:
      vars:
        - name: NEW
    preconditions:
      - sh: 'command -v git-cliff >/dev/null'
        msg: "git-cliff is not on PATH. mise.toml pins it for this repo: run 'mise install' (https://mise.jdx.dev)."
      # Prepending is not idempotent, unlike the full rewrite it replaced.
      - sh: '! grep -q "^## \[{{.NEW}}\]" CHANGELOG.md'
        msg: 'CHANGELOG.md already has a {{.NEW}} section; prepending would duplicate it.'
    cmds:
      # --unreleased --prepend, not a full rewrite: past sections stay untouched,
      # including the ones written by hand. git-cliff reuses the existing header
      # rather than emitting a second one, as long as it matches cliff.toml.
      - git-cliff --unreleased --tag v{{.NEW}} --prepend CHANGELOG.md
      - 'echo "CHANGELOG.md now has a v{{.NEW}} section"'

  release-notes:
    desc: 'Preview the GitHub Release body. Usage: task release-notes [TAG=v0.2.0]'
    vars:
      TAG: '{{.TAG | default (printf "v%s" .CURRENT)}}'
    cmds:
      - ./scripts/release-notes.sh {{.TAG}}
    silent: true

  release:
    desc: 'Bump, changelog, CI, commit, tag and push. Prompts for NEW if omitted. Usage: task release [NEW=0.2.0]'
    requires:
      vars:
        - name: NEW
    preconditions:
      - sh: 'echo "{{.NEW}}" | grep -Eq "^[0-9]+\.[0-9]+\.[0-9]+$"'
        msg: 'NEW must be semver X.Y.Z (got "{{.NEW}}")'
      - sh: 'test -z "$(git status --porcelain)"'
        msg: 'Working tree is dirty — commit or stash first.'
      - sh: '! git rev-parse -q --verify "refs/tags/v{{.NEW}}" >/dev/null'
        msg: 'Tag v{{.NEW}} already exists.'
    prompt: 'Release v{{.NEW}} — bump, run CI, commit, tag and push to origin?'
    cmds:
      - task: bump
        vars: { NEW: '{{.NEW}}' }
      - task: changelog
        vars: { NEW: '{{.NEW}}' }
      - task: release-notes
        vars: { TAG: 'v{{.NEW}}' }
      - task: ci
      - git add Cargo.toml Cargo.lock CHANGELOG.md producers/claude/.claude-plugin/plugin.json producers/codex/.codex-plugin/plugin.json producers/opencode/zellij-agent-activity.js
      - "git commit -m 'chore: release v{{.NEW}}'"
      - git tag v{{.NEW}}
      - git push origin HEAD
      - git push origin v{{.NEW}}
      - 'echo "released v{{.NEW}} — Release workflow will build & publish the wasm."'
