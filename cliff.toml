# git-cliff configuration — https://git-cliff.org/docs/configuration
# Generates CHANGELOG.md from the conventional commits. Run via `task changelog`.

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.
Generated from the conventional commits by [git-cliff](https://git-cliff.org).\n
"""

# Keep a Changelog-style sections, one per release.
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""

footer = """
{% for release in releases -%}
{% if release.previous.version -%}
[{{ release.version | trim_start_matches(pat="v") }}]: \
{{ release.repository_url }}/compare/{{ release.previous.version }}..{{ release.version }}
{% endif -%}
{% endfor %}
"""

trim = true

[git]
conventional_commits = true
# Drop anything that isn't a conventional commit rather than dumping it raw.
filter_unconventional = true
filter_commits = false
tag_pattern = "v[0-9]*"
sort_commits = "oldest"

# The commits are gitmoji-prefixed ("👷 ci: …"), which standard conventional
# parsing chokes on. Strip every leading character that is not a letter or a
# digit — this covers the emoji, its trailing space, and the variation selector
# in sequences like "♻️" (U+267B U+FE0F), which `\\W` alone would leave behind
# because Unicode marks count as word characters.
[[git.commit_preprocessors]]
pattern = '^[^\p{L}\p{N}]+'
replace = ""

# Release commits are bookkeeping, not changes worth listing.
[[git.commit_parsers]]
message = "^chore\\(release\\)|^chore: release"
skip = true

[[git.commit_parsers]]
message = "^feat"
group = "Features"

[[git.commit_parsers]]
message = "^fix"
group = "Bug Fixes"

[[git.commit_parsers]]
message = "^perf"
group = "Performance"

[[git.commit_parsers]]
message = "^refactor"
group = "Refactor"

[[git.commit_parsers]]
message = "^docs"
group = "Documentation"

[[git.commit_parsers]]
message = "^test"
group = "Testing"

[[git.commit_parsers]]
message = "^ci|^build"
group = "Build & CI"

[[git.commit_parsers]]
message = "^style"
group = "Styling"

[[git.commit_parsers]]
message = "^chore"
group = "Miscellaneous"
