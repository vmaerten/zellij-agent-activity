[package]
name = "codex-zellij"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
anyhow = "1"
futures-util = { version = "0.3", features = ["sink"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "sync", "time", "signal"] }
tokio-tungstenite = "0.28"
